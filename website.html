<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>its mani- Portfolio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }
        .projects-section {
            padding: 40px 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .projects-section h2 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2rem;
            color: #38bdf8;
        }
        .project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }
        .project-card {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 20px;
            border-radius: 12px;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }
        .project-card:hover {
            transform: translateY(-5px);
            border-color: #38bdf8;
        }
        .project-img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        .project-card h3 {
            margin-bottom: 10px;
            color: #38bdf8;
        }
        .project-card p {
            font-size: 0.95rem;
            color: #94a3b8;
            margin-bottom: 15px;
        }
        .tech-stack {
            margin-bottom: 15px;
        }
        .tech-stack span {
            background: #334155;
            color: #e2e8f0;
            padding: 4px 10px;
            font-size: 0.75rem;
            border-radius: 20px;
            margin-right: 5px;
            display: inline-block;
        }
        .project-links a {
            text-decoration: none;
            background: #38bdf8;
            color: #0f172a;
            padding: 6px 14px;
            font-size: 0.85rem;
            font-weight: bold;
            border-radius: 6px;
            margin-right: 10px;
            display: inline-block;
        }
        .project-links a:hover {
            background: #0ea5e9;
        }
    </style>
</head>
<body>

    <section id="projects" class="projects-section">
        <h2>My Projects 🚀</h2>
        <div class="project-grid">
            
            <!-- पहला प्रोजेक्ट -->
            <div class="project-card">
                <img src="maniji.jpg
                " alt="Project Image" class="project-img">
                
                <h3>AI Project / Web App</h3>
                <p>यहाँ अपने प्रोजेक्ट के बारे में लिखें कि यह क्या काम करता है।</p>
                <div class="tech-stack">
                    <span>C++</span>
                    <span>HTML/CSS</span>
                </div>
                <div class="project-links">
                    <a href="https://github.com" target="_blank">GitHub</a>
                    <a href="#" target="_blank">Live Demo</a>
                </div>
            </div>

            <!-- दूसरा प्रोजेक्ट -->
            <div class="project-card">
                <!-- यहाँ दूसरी फोटो का नाम डालें (जैसे photo2.jpg) -->
                <img src="photo2.jpg" alt="Project Image" class="project-img">
                
                <h3>Another Cool Project</h3>
                <p>यहाँ अपने दूसरे प्रोजेक्ट के बारे में लिखें।</p>
                <div class="tech-stack">
                    <span>JavaScript</span>
                    <span>AI/ML</span>
                </div>
                <div class="project-links">
                    <a href="https://github.com" target="_blank">GitHub</a>
                    <a href="#" target="_blank">Live Demo</a>
                </div>
            </div>

        </div>
    </section>

</body>
</html>
